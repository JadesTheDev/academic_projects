name: Build From the Farm

on:
  push:
    branches: [main]
    paths:
      - "SDC_445/FromTheFarm/src/**"
      - "SDC_445/FromTheFarm/public/**"
      - "SDC_445/FromTheFarm/package*.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SDC_445/FromTheFarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SDC_445/FromTheFarm/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload static app build
        uses: actions/upload-artifact@v4
        with:
          name: from-the-farm-build
          path: SDC_445/FromTheFarm/build
